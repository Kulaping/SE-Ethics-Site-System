<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test</title>
</head>
<body>
  
  <div id="results">
  </div>

  <button id="click"> </button>
  <p id ="end_mssg"></p>

  <script>  
     
    let currrentPage = 1;
    const pagePer_art = 10;

    const clickButton = document.getElementById("click");
    clickButton.addEventListener("click", () => {

      currrentPage++
      new_api_test(currrentPage);
    });

    async function new_api_test(page = 1) {
      try {
        const API_URL = `https://content.guardianapis.com/search?api-key=8d6858ef-6dd6-44ee-b70c-bb350bfec316&show-fields=thumbnail,body&page=${page}&section=technology`;

        const res = await fetch(API_URL);
        const data = await res.json();
        console.log(data);
        data.response.results.forEach(result => {

          const container = document.getElementById("results");
          //const resultDiv = document.createElement("div");

          const clickableLink = document.createElement("a");
          clickableLink.href = result.webUrl;

          console.log(result.fields.body);

          const heading = document.createElement("h3");
          heading.className = "heading";
          heading.textContent = result.webTitle;
          clickableLink.appendChild(heading);
          container.appendChild(clickableLink);

          const thumbnail = document.createElement("img");
          thumbnail.className = "art_img";

          if (result.fields && result.fields.thumbnail) {
            thumbnail.src = result.fields.thumbnail;
            container.appendChild(thumbnail);

          }
          else {
            console.log(`No thumbnail available`);
          }

        });
        getNew();
        
      } catch (error) {
        console.error("Error fetching data:", error);
      }
      
    }
    new_api_test();

  function getNew() {
   if (currrentPage === pagePer_art)  {
      console.log("test");
      const button = document.getElementById("btn");
      clickButton.remove();
      end_mssg.textContent = 'You reached the end, come back later for more news';
   }
 }
  getNew();
  </script>
</body>
</html>
